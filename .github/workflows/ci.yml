name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports
          retention-days: 14

  benchmarks:
    name: Benchmarks compile and start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build benchmark jar
        run: mvn -B package -DskipTests

      # Ölçüm değeri için değil, benchmark'ların gerçekten çalıştığını doğrulamak için:
      # tek iterasyon, tek fork. Paylaşımlı CI runner'ında alınan süreler zaten
      # güvenilir değildir; README'deki sayılar sabit bir makinede üretilir.
      - name: Smoke-run benchmarks
        run: java -jar target/benchmarks.jar -f 1 -wi 0 -i 1 -r 1s -foe true
